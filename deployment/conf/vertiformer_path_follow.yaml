# ==========================================
# VertiFormer Deployment & Inference Configuration
# ==========================================

deployment:
  checkpoint_path: vertiformer_path/checkpoint
  device: cuda

  # Action Chunking
  chunk_size: 12             # k steps to execute before replanning (must be < model.pred_len)
  goal_tolerance: 0.4      # Distance to goal in meters to trigger success

# Inference parameters
inference:
  pred_len: 12                 # desired rollout horizon at inference

# ==========================================
# Path Following & Control Configuration
# ==========================================

path_follower:
  use_pose_head: true          # True for FKD (PD Controller), False for IKD (Direct Actions)

  cfg: # Parameters for vertiformer_follower_ros_cfg.py
    guidance_scale: 0.5 # 1.0 = Strict Path Follower, 0.0 = Pure Obstacle Avoidance Prior

  temporal_ensembling:
    # Blends new trajectory with previous ones to smooth execution
    action_blend_momentum: 0.6  # For IKD (direct actions), trust the new plan 60%, preserve momentum 40%
    pose_blend_momentum: 0.85   # For FKD (PD controller waypoints)


pure_pursuit:
  Kp_v: 1.0
  Kp_w: 2.0
  lookahead_dist: 0.3
  ema_alpha_v: 0.05 # Exponential Moving Average smoothing for linear velocity
  ema_alpha_w: 0.05 # Exponential Moving Average smoothing for angular velocity

sample_rates:
  image_topic: 20
  odometry: 100
  desired_rate: 4

